name: Aktualizacja Raportu Aegis OSINT Tactical Radar

on:
  schedule:
    # Automatyczna aktualizacja co 1 godzinę (24x/dobę) — mieści się w darmowym GitHub Actions (2000 min/mies.)
    - cron: '0 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Możliwość ręcznego uruchomienia raportu 1 kliknięciem w GitHub

# Rygorystyczna zasada najniższych uprawnień (Least Privilege Security)
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "aegis-update"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🔒 Bezpieczne pobranie repozytorium (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalacja zaufanych zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📡 Pobieranie Danych Radarowych, Analiza Krajów i Generowanie Raportu HTML
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          REPORT_PIN: ${{ secrets.REPORT_PIN }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          GDRIVE_WEBHOOK_URL: ${{ secrets.GDRIVE_WEBHOOK_URL }}
        run: |
          python run.py --pages 3

      - name: 💾 Bezpieczne zapisanie bazy zdarzeń i archiwum w repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Aegis OSINT Bot"
          git add data/events.json data/archive/
          git diff --staged --quiet || git commit -m "Auto-update: Baza operacyjna & Archiwum ML [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push

      - name: 🌐 Publikacja Raportu na darmowym GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: 🚀 Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
